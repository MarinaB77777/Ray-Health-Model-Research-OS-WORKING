<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Research OS | Settings</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        .app-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; border-bottom: 1px solid #334155; padding: 12px 24px; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .back-btn { background: #334155; color: #38bdf8; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; }
        .back-btn:hover { background: #475569; color: #ffffff; }
        .page-title { color: #f8fafc; font-weight: 700; font-size: 16px; }
        .lang-picker { display: flex; gap: 6px; }
        .lang-btn { background: transparent; border: none; color: #94a3b8; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .lang-btn.active { background: #38bdf8; color: #0f172a; }
        h1 { color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-top: 16px; }
        .section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        label { font-size: 13px; color: #94a3b8; font-weight: 600; }
        input, select { background: #0f172a; border: 1px solid #475569; padding: 10px; border-radius: 6px; color: #f8fafc; }
        .btn { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .toast { background: #065f46; color: #34d399; padding: 12px; border-radius: 6px; margin-top: 16px; display: none; text-align: center; }
    </style>
</head>
<body>

<div class="app-header">
    <div class="header-left">
        <a href="index.html" class="back-btn" data-i18n="back_home">← На главную</a>
        <span class="page-title">🔬 Research OS</span>
    </div>
    <div class="lang-picker">
        <button class="lang-btn" onclick="setLang('ru', event)">🇷🇺 RU</button>
        <button class="lang-btn" onclick="setLang('es', event)">🇲🇽 ES</button>
        <button class="lang-btn" onclick="setLang('en', event)">🇬🇧 EN</button>
    </div>
</div>

<div class="container">
    <h1 data-i18n="settings_h1">⚙️ Панель управления ИИ</h1>

    <div class="section">
        <h2 data-i18n="sec1_title">1. Ваши API-ключи</h2>
        <div class="grid">
            <div class="form-group">
                <label>Groq API Key (Free):</label>
                <input type="password" id="key_groq" placeholder="gsk_...">
            </div>
            <div class="form-group">
                <label>Google Gemini API Key (Free):</label>
                <input type="password" id="key_gemini" placeholder="AIzaSy...">
            </div>
        </div>
    </div>

    <div class="section">
        <h2 data-i18n="sec2_title">2. Какой ИИ отвечает за задачи?</h2>
        <div class="form-group">
            <label data-i18n="label_analyzer">🔍 Анализ и поиск шкал (analyzer.html):</label>
            <select id="task_analyzer">
                <option value='{"provider":"groq","model":"llama-3.3-70b-versatile"}'>Groq / Llama 3.3 (Fast)</option>
                <option value='{"provider":"gemini","model":"gemini-1.5-flash"}'>Google / Gemini 1.5 Flash</option>
            </select>
        </div>
        <div class="form-group">
            <label data-i18n="label_translator">🌐 Перевод и адаптация (translator.html):</label>
            <select id="task_translator">
                <option value='{"provider":"gemini","model":"gemini-1.5-flash"}'>Google / Gemini 1.5 Flash</option>
                <option value='{"provider":"groq","model":"llama-3.3-70b-versatile"}'>Groq / Llama 3.3</option>
            </select>
        </div>
    </div>

    <button class="btn" onclick="saveAllSettings()" data-i18n="btn_save">💾 Сохранить настройки</button>
    <div id="toast" class="toast" data-i18n="toast_saved">✅ Настройки сохранены!</div>
</div>

<script>
const i18n = {
    ru: {
        back_home: "← На главную",
        settings_h1: "⚙️ Панель управления ИИ",
        sec1_title: "1. Ваши API-ключи",
        sec2_title: "2. Какой ИИ отвечает за задачи?",
        label_analyzer: "🔍 Анализ и поиск шкал (analyzer.html):",
        label_translator: "🌐 Перевод и адаптация (translator.html):",
        btn_save: "💾 Сохранить настройки",
        toast_saved: "✅ Настройки сохранены!"
    },
    es: {
        back_home: "← Inicio",
        settings_h1: "⚙️ Panel de Control de IA",
        sec1_title: "1. Sus Claves API",
        sec2_title: "2. ¿Qué IA se encarga de cada tarea?",
        label_analyzer: "🔍 Análisis y búsqueda de escalas (analyzer.html):",
        label_translator: "🌐 Traducción y adaptación (translator.html):",
        btn_save: "💾 Guardar configuración",
        toast_saved: "✅ ¡Configuración guardada!"
    },
    en: {
        back_home: "← Back to Hub",
        settings_h1: "⚙️ AI Control Panel",
        sec1_title: "1. Your API Keys",
        sec2_title: "2. Assign AI models to tasks",
        label_analyzer: "🔍 Scale analysis & search (analyzer.html):",
        label_translator: "🌐 Translation & adaptation (translator.html):",
        btn_save: "💾 Save Configuration",
        toast_saved: "✅ Configuration saved!"
    }
};

function setLang(lang, e) {
    localStorage.setItem('app_language', lang);
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    if (e) e.target.classList.add('active');

    const dict = i18n[lang] || i18n.ru;
    document.querySelectorAll('[data-i18n]').forEach(elem => {
        const key = elem.getAttribute('data-i18n');
        if (dict[key]) elem.innerText = dict[key];
    });
}

function saveAllSettings() {
    const keys = {
        groq: document.getElementById('key_groq').value.trim(),
        gemini: document.getElementById('key_gemini').value.trim()
    };
    localStorage.setItem('ai_api_keys', JSON.stringify(keys));

    const config = {
        analyzer: JSON.parse(document.getElementById('task_analyzer').value),
        translator: JSON.parse(document.getElementById('task_translator').value)
    };
    localStorage.setItem('ai_router_config', JSON.stringify(config));

    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 3000);
}

function loadSettings() {
    const keys = JSON.parse(localStorage.getItem('ai_api_keys') || '{}');
    if (keys.groq) document.getElementById('key_groq').value = keys.groq;
    if (keys.gemini) document.getElementById('key_gemini').value = keys.gemini;

    const config = JSON.parse(localStorage.getItem('ai_router_config') || '{}');
    if (config.analyzer) document.getElementById('task_analyzer').value = JSON.stringify(config.analyzer);
    if (config.translator) document.getElementById('task_translator').value = JSON.stringify(config.translator);
}

document.addEventListener('DOMContentLoaded', () => {
    loadSettings();
    const savedLang = localStorage.getItem('app_language') || 'ru';
    const btn = Array.from(document.querySelectorAll('.lang-btn')).find(b => b.innerText.toLowerCase().includes(savedLang));
    if (btn) btn.click();
});
</script>
</body>
</html>
